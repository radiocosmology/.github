name: PR description check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_call:

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body ?? '';
            const required = ['Description', 'Related issue', 'How was this tested?', 'AI usage'];
            const errors = [];

            const clean = s => s.replace(/<!--[\s\S]*?-->/g, '').trim();

            for (const name of required) {
              const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp(`^##\\s+${esc}\\s*$([\\s\\S]*?)(?=^##\\s|(?![\\s\\S]))`, 'm');
              const m = body.match(re);
              if (!m || clean(m[1]).length < 5) {
                errors.push(`Section "${name}" is missing or empty.`);
              }
            }

            const unchecked = (body.match(/^- \[ \]/gm) || []).length;
            if (unchecked > 0) {
              errors.push(`${unchecked} checklist item(s) are not ticked.`);
            }

            if (errors.length) core.setFailed(errors.join('\n'));
